services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ceylon
      POSTGRES_PASSWORD: ceylon
      POSTGRES_DB: ceylon_weddings
    ports:
      - "5432:5432"
    volumes:
      - ceylon_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ceylon -d ceylon_weddings"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ceylon_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://ceylon:ceylon@postgres:5432/ceylon_weddings?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3000
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      AI_SERVICE_URL: http://ai:8001
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  ai:
    build:
      context: ./apps/ai
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file: .env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      NEST_API_URL: http://api:4000
      PORT: 8001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ceylon_pg:
  ceylon_redis:
