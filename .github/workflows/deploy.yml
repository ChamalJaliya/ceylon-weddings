# Optional GitHub deploy. Vercel and Railway already auto-deploy from GitHub.
# Jobs no-op unless the matching secrets exist, so the workflow stays green.
#
# Secrets (only if you want this workflow to deploy):
#   RAILWAY_TOKEN, RAILWAY_PROJECT_ID, RAILWAY_API_SERVICE
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Optional AI: repo variable DEPLOY_AI=true + secret RAILWAY_AI_SERVICE
name: Deploy

on:
  workflow_run:
    workflows: ["Ceylon Weddings CI"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  railway-api:
    name: Railway API
    if: >
      secrets.RAILWAY_TOKEN != '' &&
      secrets.RAILWAY_PROJECT_ID != '' &&
      secrets.RAILWAY_API_SERVICE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy API
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment production \
            --service "${{ secrets.RAILWAY_API_SERVICE }}"

  railway-ai:
    name: Railway AI
    if: >
      vars.DEPLOY_AI == 'true' &&
      secrets.RAILWAY_TOKEN != '' &&
      secrets.RAILWAY_PROJECT_ID != '' &&
      secrets.RAILWAY_AI_SERVICE != '' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy AI
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment production \
            --service "${{ secrets.RAILWAY_AI_SERVICE }}"

  vercel-web:
    name: Vercel web
    needs: [railway-api]
    if: >
      always() &&
      secrets.VERCEL_TOKEN != '' &&
      secrets.VERCEL_ORG_ID != '' &&
      secrets.VERCEL_PROJECT_ID != '' &&
      (needs.railway-api.result == 'success' || needs.railway-api.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
