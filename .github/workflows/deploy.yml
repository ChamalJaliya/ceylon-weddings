# Manual only. Vercel and Railway already deploy from GitHub on main.
# Required secrets if you run this workflow:
#   RAILWAY_TOKEN, RAILWAY_PROJECT_ID, RAILWAY_API_SERVICE
#   VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  railway-api:
    name: Railway API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Railway secrets
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_PROJECT_ID: ${{ secrets.RAILWAY_PROJECT_ID }}
          RAILWAY_API_SERVICE: ${{ secrets.RAILWAY_API_SERVICE }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ] || [ -z "$RAILWAY_PROJECT_ID" ] || [ -z "$RAILWAY_API_SERVICE" ]; then
            echo "Railway deploy secrets are not set. Skipping. Vercel/Railway Git auto-deploy is enough."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_ENV"

      - name: Install Railway CLI
        if: env.configured == 'true'
        run: npm install -g @railway/cli

      - name: Deploy API
        if: env.configured == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --ci \
            --project "${{ secrets.RAILWAY_PROJECT_ID }}" \
            --environment production \
            --service "${{ secrets.RAILWAY_API_SERVICE }}"

  vercel-web:
    name: Vercel web
    needs: [railway-api]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Vercel secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "Vercel deploy secrets are not set. Skipping. The Vercel Git integration deploys the web app."
            exit 0
          fi
          echo "configured=true" >> "$GITHUB_ENV"

      - name: Setup Node.js
        if: env.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy production
        if: env.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: npx vercel deploy --prod --yes --token "$VERCEL_TOKEN"
